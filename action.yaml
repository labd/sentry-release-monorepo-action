name: Sentry Release
description: Create a new Sentry release and upload sourcemaps

inputs:
  package-name:
    description: 'The name of the package to release'
    required: true
  release-name:
    description: 'The name of the release to create'
    required: true
  sourcemap-flags:
    description: 'Flags to pass to sentry-cli'
    required: false
    default: '--ext .js --ext .mjs --ext .map '
  working-directory:
    description: 'The working directory to run sentry-cli in'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Derive appropriate SHAs for base and head for `nx affected` commands
      id: setSHAs
      uses: nrwl/nx-set-shas@0e2d18b530b83b68263ff7b74e46b1ba300c83fc # v3.3.2

    - name: "Run"
      shell: bash
      env:
        SENTRY_RELEASE: ${{ inputs.release-name }}
        SOURCEMAP_FLAGS: ${{ inputs.sourcemap-flags }}
        NX_BASE: ${{ steps.setSHAs.outputs.base }}
        NX_HEAD: ${{ steps.setSHAs.outputs.head }}
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "${GITHUB_REPOSITORY}@${NX_BASE}..${NX_HEAD}"
        sentry-cli releases new "${SENTRY_RELEASE}"
        sentry-cli releases set-commits "${SENTRY_RELEASE}" --commit "${GITHUB_REPOSITORY}@${NX_BASE}..${NX_HEAD}"
        sentry-cli releases files "${SENTRY_RELEASE}" upload-sourcemaps ${SOURCEMAP_FLAGS} --validate sourcemaps --wait .
